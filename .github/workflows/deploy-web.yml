# Manual web deploy (wave: CI/CD step A) — the "Deploy" button in the Actions tab.
#
# Runs tools/deploy-web.sh on a GitHub runner: DNS preflight → headless web
# export (Godot 4.7.2 + matching templates, downloaded once and cached) →
# upload → publish to the nixOS box → live-URL verify. The script owns every
# step and its checks; this file only provisions the runner.
#
# One-time setup (repo side):
#   1. Push this repo to GitHub (private is fine).
#   2. Settings → Secrets and variables → Actions → add the four secrets
#      below, copying the values from the untracked .env.deploy:
#        DEPLOY_HOST      (games.matthews.mx)
#        DEPLOY_USER      (sean)
#        DEPLOY_PASSWORD  (the sudo credential from .env.deploy)
#        DEPLOY_SSH_KEY   (the full private key text from ~/.ssh/pigeon_deploy)
#
# Rollback: every run uploads build/web as an artifact; to roll back, re-run
# an old workflow run (Actions → run → Re-run jobs) — it re-publishes that
# exact build.

name: Deploy web

on:
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: false

permissions:
  contents: read

env:
  GODOT_VERSION: "4.7.2"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Cache Godot export templates (~1 GB, one-time download)
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-templates-${{ env.GODOT_VERSION }}

      - name: Install Godot ${{ env.GODOT_VERSION }} + export templates
        run: |
          set -euo pipefail
          TAG="${GODOT_VERSION}-stable"
          if [ ! -d "$HOME/.local/share/godot/export_templates/$TAG" ]; then
            curl -fsSL -o /tmp/templates.tpz \
              "https://github.com/godotengine/godot/releases/download/$TAG/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
            mkdir -p ~/.local/share/godot/export_templates
            unzip -q /tmp/templates.tpz -d /tmp/tpl
            mv /tmp/tpl/templates "$HOME/.local/share/godot/export_templates/$TAG"
            rm -rf /tmp/templates.tpz /tmp/tpl
          fi
          if [ ! -x /usr/local/bin/godot ]; then
            curl -fsSL -o /tmp/godot.zip \
              "https://github.com/godotengine/godot/releases/download/$TAG/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
            unzip -q /tmp/godot.zip -d /tmp/godot-bin
            install -m 0755 /tmp/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
            rm -rf /tmp/godot.zip /tmp/godot-bin
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq fontconfig

      - name: Write the deploy SSH key
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/pigeon_deploy
          chmod 600 ~/.ssh/pigeon_deploy

      - name: Build and deploy (tools/deploy-web.sh)
        env:
          GODOT_BIN: /usr/local/bin/godot
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          DEPLOY_SSH_KEY: ~/.ssh/pigeon_deploy
        run: bash tools/deploy-web.sh

      - name: Keep the build for rollback
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web/
          retention-days: 30
